# The Cube's journal, which holds every container's log (the journald log driver of
# cube/compose.yaml) for the health check and the Operator: on disk, for 14 days, and nowhere
# else. scripts/deploy.sh installs it as /etc/systemd/journald.conf.d/family-agenda.conf.
[Journal]
Storage=persistent
MaxRetentionSec=14day
# Files are rotated daily, so that a day's lines are deleted when they are 14 days old.
MaxFileSec=1day
ForwardToSyslog=no
