name: Setup
description: pnpm, Node and the Routing module's dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: routing/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: routing/.nvmrc
        cache: pnpm
        cache-dependency-path: routing/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: routing
