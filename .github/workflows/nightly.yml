name: Nightly

# Every check on main: nothing runs on pushes to main. Finds pull requests that pass one by one but
# not together, and saves the mutation results the pull requests start from.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # A night without commits on main costs this job alone. Mondays and manual runs always check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      monday: ${{ steps.decide.outputs.monday }}
    permissions:
      actions: read
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        # Compares with the last completed run: a red main is checked every night until it is green. A
        # night without commits succeeds too, at the commit checked before.
        run: |
          monday=false
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 1 ]; then monday=true; fi
          checked=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] | select(.conclusion == "success") | .head_sha')
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$monday" = false ] && [ "$checked" = "$GITHUB_SHA" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "monday=$monday" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      # Mondays: a full mutation run, see the mutation job.
      force-mutation: ${{ needs.changes.outputs.monday == 'true' }}

  real-core:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/real-core.yml

  cube:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/cube.yml
