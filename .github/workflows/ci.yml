name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays: a full mutation run, see the mutation job.
    - cron: "17 3 * * 1"

# The checks of the public repo (artkoenig/family-agenda), for the Routing module in routing/.
# The static, crap and mutation jobs together are `pnpm check`; the cube job checks the deployment.
# All jobs run in parallel.
defaults:
  run:
    working-directory: routing

jobs:
  static:
    # Lint, typecheck and dependency rules (among them: no package of the public repo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise

  crap:
    # All tests with coverage, and the CRAP score. The tests create Directories, Families'
    # databases and roles on a real Postgres, as a superuser names it in TEST_DATABASE_URL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm crap

  real-core:
    # The walk-through against the core in supplied mode (test/real-core), which the stand-in core
    # of the other tests mirrors: the image cube/compose.yaml pins. The core reaches the Families'
    # databases on the postgres service by its name; the tests reach both on localhost.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      core:
        image: ghcr.io/artkoenig/family-agenda:sha-1181f1a@sha256:e72fbbff6c2accfc12e8243f576529f38745bbe93f3e1bfd5f7e70628babc3a4
        env:
          CONTEXT_MODE: supplied
          CONTEXT_KEY: ci-walk-through-context-key-of-32-characters
          CALLER_PORT: "3002"
          TRIGGER_TOKEN: ci-walk-through-trigger-token-of-32-characters
          TRIGGER_PORT: "3001"
        ports:
          - 3002:3002
          - 3001:3001
        options: >-
          --health-cmd "node -e \"fetch('http://localhost:3002/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REAL_CORE_URL: http://localhost:3002
      REAL_CORE_TRIGGER_URL: http://localhost:3001
      REAL_CORE_CONTEXT_KEY: ci-walk-through-context-key-of-32-characters
      REAL_CORE_TRIGGER_TOKEN: ci-walk-through-trigger-token-of-32-characters
      REAL_CORE_DATABASE_HOST: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm vitest run --project real-core

  mutation:
    # Mutation testing of the Routing module's pure logic (see stryker.config.json), with the unit
    # tests in test/unit only (vitest.stryker.config.ts): no Postgres, no HTTP servers, no processes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Stryker runs incrementally: it reuses the result of every mutant whose code and covering tests are
      # unchanged since the last run, and tests only the rest. A pull request reads the results main saved
      # last; each run saves its own. The weekly run tests every mutant afresh (--force), because Stryker
      # does not see changes outside src/ and test/, such as new dependencies.
      - name: Restore the last mutation results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: routing/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-
      - run: pnpm mutation ${{ github.event_name == 'schedule' && '--force' || '' }}
      - name: Save the mutation results
        if: always() && hashFiles('routing/reports/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: routing/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

  cube:
    # The Cube's deployment: the Routing module's image builds, the compose project resolves with
    # every key of cube/.env.example set (to placeholders), and the scripts pass ShellCheck.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build routing
      - name: Resolve the compose project
        run: |
          sed -E -e 's/^([A-Z_]+)=.*/\1=placeholder/' cube/.env.example > "$RUNNER_TEMP/cube.env"
          docker compose -f cube/compose.yaml --env-file "$RUNNER_TEMP/cube.env" config -q
      - run: shellcheck -x -P SCRIPTDIR scripts/bootstrap.sh scripts/deploy.sh scripts/smoke.sh
